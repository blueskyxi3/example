# Plugin-service upstream only. Keep this origin on the internal network.
# nginx -t, then verify that ready/ack arrive before the request body ends.
server {
  listen 3013;
  location / {
    proxy_pass http://127.0.0.1:3012;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
